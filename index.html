<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BHible">
  <title>BHible - Bible Reading Heat Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header id="top-bar">
      <button id="back-btn" class="icon-btn hidden" aria-label="Back">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1 id="page-title">BHible</h1>
      <div id="top-actions">
        <button id="lang-toggle" class="icon-btn lang-btn" aria-label="Toggle language">
          <span id="lang-label">EN</span>
        </button>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
          <svg id="theme-icon-dark" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <svg id="theme-icon-light" class="hidden" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        </button>
        <button id="menu-btn" class="icon-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Dropdown menu -->
    <div id="dropdown-menu" class="hidden">
      <button id="menu-export" data-i18n="exportData">Export Data</button>
      <button id="menu-import" data-i18n="importData">Import Data</button>
      <label id="import-file-label">
        <input type="file" id="import-file" accept=".json" style="display:none">
      </label>
    </div>

    <!-- Bottom Tab Bar -->
    <nav id="tab-bar">
      <button class="tab active" data-tab="heatmap">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2zm4-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm4-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z"/></svg>
        <span data-i18n="heatMap">Heat Map</span>
      </button>
      <button class="tab" data-tab="dashboard">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        <span data-i18n="dashboard">Dashboard</span>
      </button>
    </nav>

    <!-- Main Content -->
    <main id="content">
      <!-- Heat Map Page -->
      <section id="page-heatmap" class="page active">
        <!-- Testament Toggle -->
        <div id="testament-toggle">
          <button class="testament-btn active" data-testament="OT" data-i18n="oldTestament">Old Testament</button>
          <button class="testament-btn" data-testament="NT" data-i18n="newTestament">New Testament</button>
        </div>

        <!-- Book Grid (heat map blocks) -->
        <div id="book-grid"></div>

        <!-- Chapter Grid (shown when a book is selected) -->
        <div id="chapter-view" class="hidden">
          <div id="chapter-grid"></div>
        </div>

        <!-- Verse Grid (shown when a chapter is selected) -->
        <div id="verse-view" class="hidden">
          <div id="verse-toolbar">
            <button id="select-all-verses" class="toolbar-btn" data-i18n="selectAll">Select All</button>
            <button id="deselect-all-verses" class="toolbar-btn" data-i18n="clear">Clear</button>
            <a id="relight-link" class="toolbar-btn relight-btn" href="#" target="_blank" rel="noopener" data-i18n="readOnRelight">Read on Relight</a>
          </div>
          <div id="verse-grid"></div>
          <div id="verse-actions">
            <button id="mark-read-btn" class="primary-btn" disabled data-i18n="markAsRead">Mark as Read</button>
          </div>
        </div>

        <!-- Legend -->
        <div id="legend">
          <span class="legend-label" data-i18n="less">Less</span>
          <span class="legend-cell" style="--heat: 0"></span>
          <span class="legend-cell" style="--heat: 0.25"></span>
          <span class="legend-cell" style="--heat: 0.5"></span>
          <span class="legend-cell" style="--heat: 0.75"></span>
          <span class="legend-cell" style="--heat: 1"></span>
          <span class="legend-label" data-i18n="more">More</span>
        </div>
      </section>

      <!-- Dashboard Page -->
      <section id="page-dashboard" class="page hidden">
        <div id="dashboard-content">
          <!-- Filled by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script src="data/bible.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
