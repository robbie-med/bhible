<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BHible">
  <title>BHible - Bible Reading Heat Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header id="top-bar">
      <button id="back-btn" class="icon-btn hidden" aria-label="Back">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h1 id="page-title">BHible</h1>
      <div id="top-actions">
        <button id="settings-btn" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Settings Panel (slides over content) -->
    <div id="settings-overlay" class="hidden"></div>
    <div id="settings-panel" class="hidden">
      <div class="settings-header">
        <h2 data-i18n="settings">Settings</h2>
        <button id="settings-close" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <!-- Language -->
        <div class="setting-group">
          <label class="setting-label" data-i18n="language">Language</label>
          <div class="setting-options" id="lang-options">
            <button class="setting-opt" data-val="en">English</button>
            <button class="setting-opt" data-val="ko">한국어</button>
          </div>
        </div>
        <!-- Bible Reader -->
        <div class="setting-group">
          <label class="setting-label" data-i18n="bibleReader">Bible Reader</label>
          <div class="setting-options setting-options-col" id="reader-options">
            <button class="setting-opt" data-val="relight">Relight</button>
            <button class="setting-opt" data-val="hangl">Hangl (Korean/English)</button>
            <button class="setting-opt" data-val="stepbible_klb">STEP Bible (KorKLB)</button>
            <button class="setting-opt" data-val="stepbible_hkjv">STEP Bible (KorHKJV)</button>
          </div>
        </div>
        <!-- Theme -->
        <div class="setting-group">
          <label class="setting-label" data-i18n="theme">Theme</label>
          <div class="setting-options" id="theme-options">
            <button class="setting-opt" data-val="dark" data-i18n="dark">Dark</button>
            <button class="setting-opt" data-val="light" data-i18n="light">Light</button>
          </div>
        </div>
        <!-- Data -->
        <div class="setting-group">
          <label class="setting-label" data-i18n="data">Data</label>
          <div class="setting-options">
            <button class="setting-opt data-btn" id="menu-export" data-i18n="exportData">Export Data</button>
            <button class="setting-opt data-btn" id="menu-import" data-i18n="importData">Import Data</button>
            <input type="file" id="import-file" accept=".json" style="display:none">
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav id="tab-bar">
      <button class="tab active" data-tab="heatmap">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h2v2H7V7zm0 4h2v2H7v-2zm0 4h2v2H7v-2zm4-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm4-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z"/></svg>
        <span data-i18n="heatMap">Heat Map</span>
      </button>
      <button class="tab" data-tab="dashboard">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        <span data-i18n="dashboard">Dashboard</span>
      </button>
    </nav>

    <!-- Main Content -->
    <main id="content">
      <!-- Heat Map Page -->
      <section id="page-heatmap" class="page active">
        <!-- Testament Toggle -->
        <div id="testament-toggle">
          <button class="testament-btn active" data-testament="OT" data-i18n="oldTestament">Old Testament</button>
          <button class="testament-btn" data-testament="NT" data-i18n="newTestament">New Testament</button>
        </div>

        <!-- Book Grid (heat map blocks) -->
        <div id="book-grid"></div>

        <!-- Chapter Grid (shown when a book is selected) -->
        <div id="chapter-view" class="hidden">
          <div id="chapter-grid"></div>
        </div>

        <!-- Verse Grid (shown when a chapter is selected) -->
        <div id="verse-view" class="hidden">
          <div id="verse-toolbar">
            <button id="select-all-verses" class="toolbar-btn" data-i18n="selectAll">Select All</button>
            <button id="deselect-all-verses" class="toolbar-btn" data-i18n="clear">Clear</button>
            <a id="reader-link" class="toolbar-btn relight-btn" href="#" target="_blank" rel="noopener" data-i18n="readNow">Read Now</a>
          </div>
          <div id="verse-grid"></div>
          <div id="verse-actions">
            <button id="mark-read-btn" class="primary-btn" disabled data-i18n="markAsRead">Mark as Read</button>
          </div>
        </div>

        <!-- Legend -->
        <div id="legend">
          <span class="legend-label" data-i18n="less">Less</span>
          <span class="legend-cell" style="--heat: 0"></span>
          <span class="legend-cell" style="--heat: 0.25"></span>
          <span class="legend-cell" style="--heat: 0.5"></span>
          <span class="legend-cell" style="--heat: 0.75"></span>
          <span class="legend-cell" style="--heat: 1"></span>
          <span class="legend-label" data-i18n="more">More</span>
        </div>
      </section>

      <!-- Dashboard Page -->
      <section id="page-dashboard" class="page hidden">
        <div id="dashboard-content">
          <!-- Filled by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script src="data/bible.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
